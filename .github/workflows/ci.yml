# בדיקה בלבד. הפרסום נעשה ב-Vercel מענף main, לא כאן.
# ה-workflow הקודם ניסה לפרסם ל-GitHub Pages, ש-Pages מעולם לא הופעל עבורו
# בהגדרות הריפו — ולכן כל ריצה נכשלה ושלחה מייל.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 20 לא תומך בתבניות glob ב---test, ושם הבדיקות נפלו
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
